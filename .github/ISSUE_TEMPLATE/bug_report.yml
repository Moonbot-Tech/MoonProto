name: Bug report
description: Report unexpected MoonProto behavior.
body:
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: MoonProto commit or version, MoonBot core version/build date, OS, and terminal version if used.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Reproduction context
      description: Describe the setup, including exchange, market type, emulator/live mode, and subscriptions where relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Actions or API calls in order, and how often it happens. If it happened only once, describe that sequence.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior
      description: What actually happened? Include concrete values or events where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened in the same situation?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or a minimal example (optional)
      description: Include relevant timestamps and time zones for logs. Remove keys, passwords, and private account data.
